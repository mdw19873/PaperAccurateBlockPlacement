# Dependabot configuration - https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2

updates:
  # Gradle build dependencies (test libraries, PacketEvents, etc.).
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Labels must already exist in the repository - Dependabot silently drops any
    # it cannot find and does NOT create them when `labels` is set explicitly.
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "build"
      include: "scope"
    # Group minor and patch bumps into one PR to cut noise; major bumps get their
    # own PR so potentially breaking changes are reviewed individually.
    groups:
      gradle-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # paper-api is intentionally pinned to the MC 1.21 support floor (compile) and
      # ceiling (tests). Changing it is a deliberate support-range decision, not an
      # automatic bump - manage it by hand.
      - dependency-name: "io.papermc.paper:paper-api"

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    # Action bumps are usually safe together, so collapse them into a single PR.
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # ci.yml pins actions to floating major tags (@v6, @v7), which upstream moves
      # to each new release - so minor/patch bumps are already picked up without a
      # PR. Left unfiltered, Dependabot rewrites those tags to exact versions
      # (e.g. gradle/actions@v6 -> @v6.2.0), which freezes CI on an older commit
      # than the one @v6 already resolves to. Only major bumps need a PR.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
